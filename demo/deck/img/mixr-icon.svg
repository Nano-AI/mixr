<svg xmlns="http://www.w3.org/2000/svg" width="612" height="612" viewBox="322 263 612 612" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Mixr</title>
  <desc id="desc">Mixr liquid glass logo. Vector recreation with pearlescent blue, lilac and peach, subtle edges and a square silhouette, and a white flowing x.</desc>
  <defs>
    <path id="tile" d="M322 263H934V875H322Z"/>
    <clipPath id="glass-clip"><use href="#tile"/></clipPath>
    <linearGradient id="body" x1="390" y1="290" x2="880" y2="864" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9f4ff"/><stop offset=".38" stop-color="#bbcaff"/><stop offset=".68" stop-color="#b9b8f6"/><stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <radialGradient id="bloom"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#93b9ff"/><stop offset="1" stop-color="#93b9ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#ffbbeb"/><stop offset="1" stop-color="#ffbbeb" stop-opacity="0"/></radialGradient>
    <radialGradient id="peach"><stop stop-color="#ffe8ce"/><stop offset=".35" stop-color="#ffddd9" stop-opacity=".92"/><stop offset="1" stop-color="#ffdadf" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="328" y1="410" x2="929" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8badee"/><stop offset=".2" stop-color="#d6e5ff"/><stop offset=".53" stop-color="#cbc3ef"/><stop offset=".8" stop-color="#f2c5e7"/><stop offset="1" stop-color="#ffdedb"/>
    </linearGradient>
    <linearGradient id="mark" x1="530" y1="427" x2="765" y2="746" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#fcfaff"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="refraction" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="30" stdDeviation="31" flood-color="#7777ba" flood-opacity=".19"/><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#a7a2ce" flood-opacity=".12"/></filter>
    <filter id="mark-depth" x="-40%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#8874b5" flood-opacity=".16"/></filter>
  </defs>
  <g opacity=".48" filter="url(#soft)">
    <ellipse cx="466" cy="861" rx="180" ry="90" fill="url(#blue)"/>
    <ellipse cx="753" cy="877" rx="170" ry="95" fill="url(#peach)"/>
  </g>
  <use href="#tile" fill="url(#body)" filter="url(#shadow)"/>
  <g clip-path="url(#glass-clip)">
    <ellipse cx="915" cy="425" rx="205" ry="260" fill="url(#peach)"/>
    <ellipse cx="915" cy="578" rx="140" ry="240" fill="url(#pink)" opacity=".72"/>
    <ellipse cx="411" cy="710" rx="188" ry="210" fill="url(#peach)"/>
    <ellipse cx="348" cy="793" rx="138" ry="188" fill="url(#pink)"/>
    <ellipse cx="671" cy="849" rx="173" ry="161" fill="url(#peach)"/>
    <ellipse cx="793" cy="638" rx="196" ry="195" fill="url(#blue)" opacity=".8"/>
    <use href="#tile" fill="none" stroke="#fff" stroke-width="10" opacity=".22" filter="url(#refraction)"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#edge)" stroke-width="1" stroke-opacity=".4"/>
  <path d="M506 428C500 428 498 431 498 437V451C498 457 500 459 506 459H514C541 459 555 471 567 497L607 578L480 741C478 744 479 745 483 745H538C543 745 546 744 549 740L629 625L664 698C683 738 704 747 744 747L784 745C790 745 792 743 792 737V723C792 717 790 714 784 715H775C749 715 733 702 720 677L667 569L772 432C775 428 774 427 770 427H716C710 427 708 428 705 433L645 522L619 465C604 433 583 426 548 427Z" fill="url(#mark)" filter="url(#mark-depth)"/>

</svg>
